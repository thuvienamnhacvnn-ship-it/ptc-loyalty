# ptc-bonus.com — public site, dashboard, POS API and provider webhooks.
#
# The WhatsApp gateway is deliberately NOT proxied here: it is reachable only on
# the internal Docker network, so it has no public attack surface at all.

# The upstream is referenced through a VARIABLE on purpose: nginx then resolves
# `app` per request via Docker's DNS instead of at startup, so nginx boots (and
# serves the ACME challenge) even before the app container exists. That is what
# makes the first-certificate bootstrap work.

# ── HTTP: ACME challenge + redirect everything else to HTTPS ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ptc-bonus.com www.ptc-bonus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ptc-bonus.com$request_uri;
    }
}

# ── HTTPS: www → apex ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ptc-bonus.com;

    ssl_certificate     /etc/letsencrypt/live/ptc-bonus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptc-bonus.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    return 301 https://ptc-bonus.com$request_uri;
}

# ── HTTPS: the application ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ptc-bonus.com;

    ssl_certificate     /etc/letsencrypt/live/ptc-bonus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptc-bonus.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    limit_conn perip 40;

    # Resolved at request time (see note at the top of this file).
    set $ptc_app "app:3000";

    # Next's hashed build assets are immutable — let the browser keep them.
    location /_next/static/ {
        proxy_pass http://$ptc_app$request_uri;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://$ptc_app$request_uri;
    }

    # Brute-force surface: credential login and password reset.
    location ~ ^/(login|register|forgot-password|reset-password|api/auth) {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://$ptc_app$request_uri;
    }

    location = /api/health {
        proxy_pass http://$ptc_app$request_uri;
        access_log off;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://$ptc_app$request_uri;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}

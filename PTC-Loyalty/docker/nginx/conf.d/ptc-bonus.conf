# ptc-bonus.com — public site, dashboard, POS API and provider webhooks.
#
# The WhatsApp gateway is deliberately NOT proxied here: it is reachable only on
# the internal Docker network, so it has no public attack surface at all.

# The upstream is referenced through a VARIABLE on purpose: nginx then resolves
# `app` per request via Docker's DNS instead of at startup, so nginx boots (and
# serves the ACME challenge) even before the app container exists. That is what
# makes the first-certificate bootstrap work.

# ── HTTP: ACME challenge + redirect everything else to HTTPS ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ptc-bonus.com www.ptc-bonus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ptc-bonus.com$request_uri;
    }
}

# ── HTTPS: www → apex ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ptc-bonus.com;

    ssl_certificate     /etc/letsencrypt/live/ptc-bonus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptc-bonus.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    return 301 https://ptc-bonus.com$request_uri;
}

# ── HTTPS: the application ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ptc-bonus.com;

    ssl_certificate     /etc/letsencrypt/live/ptc-bonus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptc-bonus.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    limit_conn perip 40;

    # Resolved at request time (see note at the top of this file).
    set $ptc_app "app:3000";

    # Next's hashed build assets are immutable — let the browser keep them.
    location /_next/static/ {
        proxy_pass http://$ptc_app$request_uri;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://$ptc_app$request_uri;
    }

    # Brute-force surface: credential login and password reset.
    location ~ ^/(login|register|forgot-password|reset-password|api/auth) {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://$ptc_app$request_uri;
    }

    location = /api/health {
        proxy_pass http://$ptc_app$request_uri;
        access_log off;
    }

    # Ảnh và video nặng của các site PTC khác. Phục vụ file thuần: nginx tự lo
    # byte-range mà thẻ <video> đòi khi tua, và không request nào chạm tới app.
    # Cố ý MIỄN rate limit `general` — một video là rất nhiều range request.
    location /media/ {
        alias /srv/media/;
        autoindex off;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        # Nội dung đã nén sẵn; gzip chỉ tốn CPU.
        gzip off;
    }

    # Media engine (dịch vụ riêng, khai ở docker-compose.media.yml — không thuộc
    # ứng dụng này). Phải nằm trong block APEX: đặt nhầm sang block www thì mọi
    # request bị 301 về apex rồi rơi vào `location /` và trả 404, mà container
    # lại không mở cổng ra host nên không còn đường nào khác vào.
    #
    # Upstream đi qua BIẾN, cùng lý do với $ptc_app ở trên nhưng hậu quả nặng
    # hơn: viết hostname cứng thì nginx phân giải lúc khởi động, nên chỉ cần
    # container engine vắng mặt là nginx KHÔNG BOOT ĐƯỢC và ptc-bonus.com chết
    # theo — một dịch vụ đi nhờ không được phép kéo cả site xuống. `rewrite …
    # break` để cắt tiền tố /media-engine/, việc mà proxy_pass hostname cứng
    # kèm dấu / vẫn làm tự động nhưng biến thì không.
    location /media-engine/ {
        set $media_engine "ptc-media-engine:8756";
        rewrite ^/media-engine/(.*)$ /$1 break;
        proxy_pass         http://$media_engine;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        # Tách beat một bài nhạc chạy rất lâu và file tải lên rất nặng.
        client_max_body_size 120m;
        proxy_read_timeout   1800s;
        proxy_send_timeout   1800s;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://$ptc_app$request_uri;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}

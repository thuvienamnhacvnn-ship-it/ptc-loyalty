<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Thẻ thành viên QR">
  <defs>
    <linearGradient id="g-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E1B"/><stop offset="1" stop-color="#0A1F3D"/>
    </linearGradient>
    <linearGradient id="c-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#145DFF"/>
    </linearGradient>
    <linearGradient id="au-hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8893F"/><stop offset=".5" stop-color="#CDA45E"/><stop offset="1" stop-color="#B8893F"/>
    </linearGradient>
    <radialGradient id="glow-hero" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#145DFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#145DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-hero" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#5B8CFF" opacity=".26"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#g-hero)"/>
  <rect width="1200" height="800" fill="url(#dots-hero)"/>
  <ellipse cx="864" cy="176" rx="504" ry="336" fill="url(#glow-hero)"/>
  <polygon points="0,800 552,800 0,336" fill="#145DFF" opacity=".14"/>

  <g transform="translate(0 -150)">
    <path fill="none" stroke="url(#c-hero)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  d="M420 330 h120 v120 H420 z M660 330 h120 v120 H660 z M420 570 h120 v120 H420 z"/>
    <path fill="none" stroke="url(#au-hero)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  d="M470 380 h20 v20 h-20 z M710 380 h20 v20 h-20 z M470 620 h20 v20 h-20 z"/>
    <path fill="none" stroke="url(#c-hero)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  d="M660 570 h40 v40 h-40 z M740 570 h40 v40 h-40 z M660 650 h40 v40 h-40 z M740 650 h40 v40 h-40 z"/></g>

  <path d="M64 736 H 360" stroke="url(#au-hero)" stroke-width="2" opacity=".95"/>
  
  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#5B8CFF" stroke-width="2" opacity=".16"/>
</svg>

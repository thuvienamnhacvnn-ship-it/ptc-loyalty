    <path fill="none" stroke="url(#c-servicedruck)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  d="M500 550 h200 v130 H500 z"/>
    <path fill="none" stroke="url(#au-servicedruck)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  d="M546 596 h108 M546 638 h108"/>
    <circle fill="none" stroke="url(#c-servicedruck)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  cx="726" cy="462" r="14"/></g>


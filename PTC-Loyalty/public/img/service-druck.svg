<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Druck">
  <defs>
    <linearGradient id="g-servicedruck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E1B"/><stop offset="1" stop-color="#0A1F3D"/>
    </linearGradient>
    <linearGradient id="c-servicedruck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#145DFF"/>
    </linearGradient>
    <linearGradient id="au-servicedruck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8893F"/><stop offset=".5" stop-color="#CDA45E"/><stop offset="1" stop-color="#B8893F"/>
    </linearGradient>
    <radialGradient id="glow-servicedruck" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#145DFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#145DFF" stop-opacity="0"/>

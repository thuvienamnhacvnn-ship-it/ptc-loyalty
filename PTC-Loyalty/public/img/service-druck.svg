    <pattern id="dots-servicedruck" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#5B8CFF" opacity=".26"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#g-servicedruck)"/>

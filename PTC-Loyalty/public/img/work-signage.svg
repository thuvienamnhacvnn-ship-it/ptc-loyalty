<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Thi công biển hiệu">
  <defs>
    <linearGradient id="g-worksignage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E1B"/><stop offset="1" stop-color="#0A1F3D"/>
    </linearGradient>
    <linearGradient id="c-worksignage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#145DFF"/>
    </linearGradient>
    <linearGradient id="au-worksignage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8893F"/><stop offset=".5" stop-color="#CDA45E"/><stop offset="1" stop-color="#B8893F"/>
    </linearGradient>
    <radialGradient id="glow-worksignage" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#145DFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#145DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-worksignage" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#5B8CFF" opacity=".26"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#g-worksignage)"/>
  <rect width="1200" height="800" fill="url(#dots-worksignage)"/>
  <ellipse cx="864" cy="176" rx="504" ry="336" fill="url(#glow-worksignage)"/>
  <polygon points="0,800 552,800 0,336" fill="#145DFF" opacity=".14"/>

  <g transform="translate(0 0)">
    <path fill="none" stroke="url(#c-worksignage)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  d="M380 640 h440"/>
    <path fill="none" stroke="url(#c-worksignage)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  d="M470 640 V400 h260 v240"/>
    <path fill="none" stroke="url(#c-worksignage)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  d="M470 400 l130 -90 130 90"/>
    <path fill="none" stroke="url(#au-worksignage)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  d="M540 640 V500 h120 v140"/>
    <circle fill="none" stroke="url(#c-worksignage)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"  cx="820" cy="470" r="26"/></g>

  <path d="M64 736 H 360" stroke="url(#au-worksignage)" stroke-width="2" opacity=".95"/>
  
  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#5B8CFF" stroke-width="2" opacity=".16"/>
</svg>
